name: API regression qualification

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-regression-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: 36 cases / 180 invocations / portable GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc
      ARCH_FLAGS: ''
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      ABS_CERT_UNIQUE_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Build portable solver
        run: ./build.sh
      - name: Run exact 36-case qualification matrix
        run: |
          python tests/api_regression_qualification.py \
            --expect-unique-cases 36 \
            --output reports/api-regression/qualification.json
          python -m unittest tests/test_api_regression_qualification.py -v
      - name: Validate counts and IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/api-regression/qualification.json').read_text())
          assert payload['unique_case_count'] == 36
          assert len(payload['unique_case_ids']) == len(set(payload['unique_case_ids'])) == 36
          assert payload['expected_invocations'] == 180
          assert payload['attempted_invocations'] == 180
          assert payload['completed_invocations'] == 180
          assert payload['skipped_invocations'] == 0
          assert set(payload['mode_counts']) == {
              'legacy_diagnostic', 'combined_default',
              'combined_tight_compatibility', 'combined_wide_rank_band',
              'combined_tight_quality'
          }
          assert all(value == 36 for value in payload['mode_counts'].values())
          PY
      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-regression-qualification
          path: reports/api-regression/qualification.json
          if-no-files-found: error
          retention-days: 30
