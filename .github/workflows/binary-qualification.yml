name: binary-sdk-qualification

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Empty for qualification; validated project version for release candidates
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: SDK / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
            triplet: x86_64-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cc: gcc-13
            cxx: g++-13
            triplet: aarch64-linux-gnu
          - target: macos-arm64
            runner: macos-15
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: External Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $CC $CXX libblas-dev liblapack-dev pkg-config patchelf
      - name: External macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew list libomp >/dev/null 2>&1 || brew install libomp
          brew list openblas >/dev/null 2>&1 || brew install openblas
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Configure native portable SDK
        env:
          TRIPLET: ${{ matrix.triplet }}
        run: |
          mkdir -p evidence
          {
            uname -a
            "$CC" --version
            cmake --version
            if [ "$RUNNER_OS" = macOS ]; then
              sw_vers
              xcodebuild -version
              brew list --versions openblas libomp
            else
              cat /etc/os-release
              getconf GNU_LIBC_VERSION
              dpkg-query -W libblas3 liblapack3 libgomp1
            fi
          } | tee evidence/environment.txt
          options=()
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(uname -m)" = arm64
            "$CC" --version | grep 'Apple clang'
            omp=$(brew --prefix libomp)
            options+=("-DBLA_VENDOR=OpenBLAS" "-DCMAKE_PREFIX_PATH=$(brew --prefix openblas)"
              "-DOpenMP_C_FLAGS=-Xpreprocessor -fopenmp"
              "-DOpenMP_C_INCLUDE_DIR=$omp/include" "-DOpenMP_C_LIB_NAMES=omp"
              "-DOpenMP_omp_LIBRARY=$omp/lib/libomp.dylib" "-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0")
          else
            options+=("-DBLA_VENDOR=Generic" "-DBLAS_LIBRARIES=/usr/lib/$TRIPLET/blas/libblas.so"
              "-DLAPACK_LIBRARIES=/usr/lib/$TRIPLET/lapack/liblapack.so;/usr/lib/$TRIPLET/blas/libblas.so")
          fi
          cmake -S . -B build-sdk -DABS_BLAS=system -DABS_ARCH_FLAGS='' \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "${options[@]}" 2>&1 | tee evidence/configure.txt
      - name: Build and runtime FP probes
        run: cmake --build build-sdk --parallel 3 2>&1 | tee evidence/build.txt
      - name: Full applicable tests including strict no-contraction gate
        run: ctest --test-dir build-sdk --output-on-failure -V 2>&1 | tee evidence/ctest.txt
      - name: Full properties and source semantic baseline
        env:
          ABS_LIB_DIR: ${{ github.workspace }}/build-sdk
        run: |
          python tests/pbt_equivalence_orbits.py --strict --output evidence/property-equivalence.json
          python tests/pbt_certificate_equivariance.py --strict --output evidence/property-certificates.json
          python tests/compare_builds.py --snapshot build-sdk --output evidence/source-semantic.json
          "$CC" -Wall -Wextra -Iinclude tests/binary_sdk_smoke.c -Lbuild-sdk \
            -lcertified_solver -laffine_bundle_solver -lm -Wl,-rpath,"$PWD/build-sdk" -o "$RUNNER_TEMP/source-api"
          "$RUNNER_TEMP/source-api" > evidence/source-api.json
      - name: Install, audit and package exact committed SDK
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SDK_TARGET: ${{ matrix.target }}
        run: |
          options=()
          if [ -n "$RELEASE_VERSION" ]; then
            options+=(--mode release --version "$RELEASE_VERSION")
          fi
          python tools/package_binary_sdk.py package build-sdk "$PWD/sdk-output" "$SDK_TARGET" "${options[@]}"
      - name: Consume archive with original build and staging prefixes unavailable
        run: |
          mv build-sdk "$RUNNER_TEMP/unavailable-build-sdk"
          mv sdk-output/stage "$RUNNER_TEMP/unavailable-stage"
          archives=("$PWD"/sdk-output/*.tar.gz)
          test "${#archives[@]}" = 1
          bash tools/test_binary_sdk.sh "${archives[0]}" "$RUNNER_TEMP/builder-consumer" \
            "$PWD/evidence/source-semantic.json" "$PWD/evidence/source-api.json" 2>&1 | tee evidence/consumer.txt
          cp "$RUNNER_TEMP/builder-consumer/"{binary-semantic.json,sdk-smoke.json,inspection.json,missing-dependencies.json} evidence/
          cp sdk-output/BUILD-INFO.json sdk-output/*.sha256 evidence/
      - name: Preserve consumer evidence even on a failing qualification
        if: always()
        run: |
          mkdir -p evidence/consumer-artifacts
          for name in binary-semantic.json sdk-smoke.json inspection.json missing-dependencies.json; do
            test -f "$RUNNER_TEMP/builder-consumer/$name" && cp "$RUNNER_TEMP/builder-consumer/$name" evidence/consumer-artifacts/
          done
      - name: Preserve exact qualified archive bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-${{ matrix.target }}
          path: |
            sdk-output/*.tar.gz
            sdk-output/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Retain qualification evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-evidence-${{ matrix.target }}
          path: |
            evidence/
            sdk-output/inspection.json
            sdk-output/BUILD-INFO.json
          if-no-files-found: error
          retention-days: 30

  forward:
    name: Exact x86 SDK / Ubuntu 24.04 forward consumption
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-linux-x86_64
          path: sdk-download
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-evidence-linux-x86_64
          path: builder-evidence
      - name: Install external runtimes and consumer tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas3 liblapack3 libgomp1 pkg-config patchelf
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Consume exact builder bytes without building solver
        shell: bash
        run: |
          mkdir forward-evidence
          { uname -a; getconf GNU_LIBC_VERSION; gcc --version; dpkg-query -W libblas3 liblapack3 libgomp1; } > forward-evidence/environment.txt
          archives=("$PWD"/sdk-download/*.tar.gz)
          test "${#archives[@]}" = 1
          bash tools/test_binary_sdk.sh "${archives[0]}" "$RUNNER_TEMP/forward-consumer" \
            "$PWD/builder-evidence/evidence/source-semantic.json" \
            "$PWD/builder-evidence/evidence/source-api.json" 2>&1 | tee forward-evidence/consumer.txt
          cp "$RUNNER_TEMP/forward-consumer/"{binary-semantic.json,sdk-smoke.json,inspection.json,missing-dependencies.json} forward-evidence/
          cp sdk-download/*.sha256 forward-evidence/
      - name: Preserve forward-consumer evidence even on failure
        if: always()
        run: |
          mkdir -p forward-evidence/consumer-artifacts
          for name in binary-semantic.json sdk-smoke.json inspection.json missing-dependencies.json; do
            test -f "$RUNNER_TEMP/forward-consumer/$name" && cp "$RUNNER_TEMP/forward-consumer/$name" forward-evidence/consumer-artifacts/
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdk-evidence-forward-x86_64
          path: forward-evidence/
          if-no-files-found: error
          retention-days: 30

  qualification-gate:
    name: binary qualification gate
    needs: [build, forward]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native build and exact-byte consumer
        env:
          BUILD: ${{ needs.build.result }}
          FORWARD: ${{ needs.forward.result }}
        run: test "$BUILD" = success && test "$FORWARD" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sdk-evidence-*
          path: evidence
      - name: Cross-platform packaged semantics must agree
        run: |
          python tests/compare_builds.py --compare-snapshots \
            evidence/sdk-evidence-linux-x86_64/evidence/binary-semantic.json \
            evidence/sdk-evidence-linux-arm64/evidence/binary-semantic.json \
            evidence/sdk-evidence-macos-arm64/evidence/binary-semantic.json \
            evidence/sdk-evidence-forward-x86_64/binary-semantic.json
          python - <<'PY'
          import json
          from pathlib import Path
          # `consumer-artifacts/` deliberately retains a diagnostic copy on
          # failure; only the canonical result participates in the gate.
          paths = sorted(p for p in Path('evidence').rglob('sdk-smoke.json')
                         if 'consumer-artifacts' not in p.parts)
          assert len(paths) == 4, paths
          rows = [json.loads(p.read_text()) for p in paths]
          assert all(x == rows[0] for x in rows), rows
          print('All four packaged policy/streaming API snapshots agree')
          PY
