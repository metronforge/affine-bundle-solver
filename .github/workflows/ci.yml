name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      binary_qualification:
        description: Also qualify installed binary SDKs (no publication)
        type: boolean
        default: false
      release_candidate_dry_run:
        description: Build and qualify the complete candidate without publishing or changing versions
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No paths-ignore here on purpose.  These jobs are required checks, and a
# required check that is filtered out never reports, so the pull request waits
# for a result that will not arrive.  Filtering belongs on the optional
# workflows, which is where it now lives.

permissions:
  contents: read

jobs:
  release-context:
    name: release candidate context
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.context.outputs.build }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Validate identity and detect candidate requirement
        id: context
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate_dry_run }}
        run: |
          options=()
          if [ "$DRY_RUN" = true ]; then options+=(--dry-run); fi
          python3 tools/release_assets.py context . "${options[@]}" >> "$GITHUB_OUTPUT"

  publication-validation:
    name: publication validation tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          python3 -m unittest discover -s tests -p test_source_identity.py
          python3 -m unittest discover -s tests -p test_release_assets.py
          python3 -m unittest discover -s tests -p test_binary_sdk.py

  binary-qualification:
    needs: release-context
    if: needs.release-context.outputs.build == 'true' || (github.event_name == 'workflow_dispatch' && inputs.binary_qualification)
    uses: ./.github/workflows/binary-qualification.yml
    with:
      release_version: ${{ needs.release-context.outputs.build == 'true' && needs.release-context.outputs.version || '' }}

  build-and-test:
    name: ${{ matrix.cc }} / ${{ matrix.arch_label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable build is the reference configuration: results must not
          # depend on the instruction set of the build machine.
          - cc: gcc
            arch: ''
            arch_label: portable
          # -march=native is the default in build.sh and is what the paper's
          # timings were produced with.
          - cc: gcc
            arch: '-march=native'
            arch_label: native
          # clang is REQUIRED, not informational.  It exercises a different
          # floating-point front end, and the manuscript's separation of the
          # fast router from the strict proof kernels is a claim about
          # compilers, not a convenience.  Making this job optional would
          # demote the only check that tests that claim.
          #
          # It has already earned its place twice: it caught a missing
          # libatomic dependency (clang emits __atomic_compare_exchange for
          # reduction(max:) on a double where GCC uses libgomp), and then the
          # mxcsr probe caught clang's link-time FTZ/DAZ constructor setting
          # the process floating-point mode -- which would have made the
          # subnormal-range certificate checks pass vacuously.  GCC exhibits
          # neither.
          - cc: clang
            arch: ''
            arch_label: portable

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install compiler
        run: |
          sudo apt-get update
          if [ "${{ matrix.cc }}" = "clang" ]; then
            # libomp-dev is required: the clang package does not ship an
            # OpenMP runtime, and build.sh passes -fopenmp.
            sudo apt-get install -y clang libomp-dev libatomic1
          fi
          ${{ matrix.cc }} --version

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -c "import numpy,scipy,mpmath,threadpoolctl; \
            print('numpy',numpy.__version__,'scipy',scipy.__version__)"

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          ARCH_FLAGS: ${{ matrix.arch }}
        run: |
          chmod +x build.sh
          ./build.sh
        # build.sh runs two build-time probes and fails the build if either
        # fails:
        #   rounding_probe -- upward and downward rounding are distinguishable
        #   mxcsr_probe    -- loading the -ffast-math fast library does not set
        #                     FTZ/DAZ process-wide, which would make the
        #                     subnormal-range certificate checks vacuous

      - name: Compiler warning report
        run: |
          # Two corrections to this scan, both found by it reporting nothing.
          #
          # -Iinclude: the public headers moved to include/, so every file
          # that includes affine_bundle/*.h stopped compiling here.  The
          # failure was swallowed by `|| true` and the grep then found no
          # warnings, so the scan reported a clean bsolver.c while the real
          # build had a dozen.  Errors are now printed instead of hidden.
          #
          # src/bsolver_core.c is #included into bsolver.c and is not a
          # translation unit.  Compiled alone it reports functions as unused
          # that its includer does use, which is noise, not signal.
          log=$(mktemp)
          compile_failed=0
          for f in src/*.c; do
            case "$f" in */bsolver_core.c) continue ;; esac
            if ! ${{ matrix.cc }} -std=c11 -Wall -Wextra -Wshadow \
                 -c "$f" -o /dev/null -Isrc -Iinclude >>"$log" 2>&1; then
              compile_failed=1
            fi
          done
          echo "::group::strict warning scan"
          grep "warning:" "$log" | sed 's/.*warning: //' \
            | sort | uniq -c | sort -rn || true
          echo "::endgroup::"
          if grep -q "error:" "$log"; then
            echo "::group::the scan itself failed to compile something"
            grep "error:" "$log" || true
            echo "::endgroup::"
          fi
          exit "$compile_failed"

      - name: Regression tests
        run: |
          for t in test_certified_api \
                   test_verifier_adversarial \
                   test_status_profile_semantics \
                   test_meta_api_absent_solution_quality \
                   test_streaming_equivalence \
                   test_threshold_contract \
                   test_public_diagnostics \
                   test_stream_storage \
                   test_core_rank_boundary \
                   test_blockprefix_guard \
                   test_route_agreement; do
            echo "::group::$t"
            python tests/$t.py
            echo "::endgroup::"
          done

      - name: Versioned operational policy ABI and concurrency
        run: |
          ${{ matrix.cc }} -Iinclude tests/test_operational_policy.c -L. \
            -lcertified_solver -laffine_bundle_solver -lm -lpthread \
            -Wl,-rpath,"$PWD" -o /tmp/test-operational-policy
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 ABS_CERT_UNIQUE_THREADS=1 /tmp/test-operational-policy

      - name: Synthetic benchmark contract
        run: python tests/test_synthetic_bench_contract.py


      - name: Manuscript performance claim coverage
        if: matrix.cc == 'gcc' && matrix.arch_label == 'portable'
        env:
          PR34_SOURCE: 67eef1fbda6f7486357cba200f01c9f355ac854a
        run: |
          python tests/check_paper_claims.py --check-performance-inventory
          git fetch --no-tags --depth=1 origin "$PR34_SOURCE"
          test "$(git rev-parse FETCH_HEAD)" = "$PR34_SOURCE"
          (cd results && sha256sum -c synthetic-reference.sha256)
          python tests/check_paper_claims.py \
            --audit-performance-artifacts . \
            --require-publication-ready

      - name: Synthetic benchmark smoke
        env:
          CC: ${{ matrix.cc }}
          ARCH_FLAGS: ${{ matrix.arch }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          python experiments/synthetic_bench.py \
            --no-large --repeats 1 --seed 20260909 --driver gelsy \
            --out /tmp/synthetic-smoke.csv \
            --metadata-out /tmp/synthetic-smoke.metadata.json \
            --reference-machine ci-smoke

      - name: Property batteries
        run: |
          echo "::group::pbt_equivalence_orbits"
          python tests/pbt_equivalence_orbits.py --strict
          echo "::endgroup::"
          echo "::group::pbt_certificate_equivariance"
          python tests/pbt_certificate_equivariance.py --strict
          echo "::endgroup::"

      - name: Manuscript claim reproduction
        # This is the step that matters for a paper artifact: it fails when a
        # number printed in paper.tex no longer comes out of the build, even
        # if every individual test passes.
        run: python tests/check_paper_claims.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libs-${{ matrix.cc }}-${{ matrix.arch_label }}
          path: |
            *.so
          retention-days: 14
          if-no-files-found: error

      - name: Cross-platform semantic snapshot (x86 reference)
        if: matrix.cc == 'gcc' && matrix.arch_label == 'portable'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          test "$(uname -m)" = x86_64
          python tests/compare_builds.py --snapshot . --output semantic-linux-x86_64-gcc.json
      - name: Upload x86 semantic reference
        if: matrix.cc == 'gcc' && matrix.arch_label == 'portable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-linux-x86_64-gcc
          path: semantic-linux-x86_64-gcc.json
          if-no-files-found: error
      - name: Upload x86 source and binary provenance
        if: matrix.cc == 'gcc' && matrix.arch_label == 'portable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance-linux-x86_64-gcc
          path: .abs-build-manifest.json
          include-hidden-files: true
          if-no-files-found: error

  portability:
    name: portability / ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-arm64-gcc
            runner: ubuntu-24.04-arm
            cc: gcc
          - id: linux-arm64-clang
            runner: ubuntu-24.04-arm
            cc: clang
          - id: macos-arm64-appleclang
            runner: macos-15
            cc: clang
    env:
      CC: ${{ matrix.cc }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev pkg-config
          if [ "$CC" = clang ]; then
            sudo apt-get install -y clang libomp-dev libatomic1
          fi
      - name: Install macOS OpenMP and validated BLAS provider
        if: runner.os == 'macOS'
        run: |
          brew list libomp >/dev/null 2>&1 || brew install libomp
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          # Accelerate links every required symbol but fails the existing
          # rank-deficient accepted-status-mask regression; see Phase 1 report.
          brew list openblas >/dev/null 2>&1 || brew install openblas
          xcrun --find llvm-objdump
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify runner identity and configure portable system BLAS build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portability-evidence
          test "$RUNNER_ARCH" = ARM64
          case "$(uname -m)" in aarch64|arm64) ;; *) exit 1 ;; esac
          {
            uname -a
            "$CC" --version
            cmake --version
            if [ "$RUNNER_OS" = macOS ]; then
              sw_vers
              xcodebuild -version
              brew list --versions libomp openblas
              xcrun llvm-objdump --version
            else
              dpkg-query -W libblas3 liblapack3 libgomp1 libomp5-18 libatomic1 2>/dev/null || true
              objdump --version
            fi
          } | tee portability-evidence/environment.txt
          options=()
          if [ "$RUNNER_OS" = macOS ]; then
            "$CC" --version | grep 'Apple clang'
            omp=$(brew --prefix libomp)
            options+=("-DBLA_VENDOR=OpenBLAS" "-DCMAKE_PREFIX_PATH=$(brew --prefix openblas)"
              "-DOpenMP_C_FLAGS=-Xpreprocessor -fopenmp"
              "-DOpenMP_C_INCLUDE_DIR=$omp/include" "-DOpenMP_C_LIB_NAMES=omp"
              "-DOpenMP_omp_LIBRARY=$omp/lib/libomp.dylib")
          fi
          cmake -S . -B build-portable -DABS_BLAS=system -DABS_ARCH_FLAGS='' \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "${options[@]}" 2>&1 | tee portability-evidence/configure.txt
      - name: Build and runtime FP gates
        run: cmake --build build-portable --parallel 3 2>&1 | tee portability-evidence/build.txt
      - name: Record tested source and binary identity
        run: python tools/record_portability_build.py build-portable portability-evidence/provenance.json
      - name: Full applicable CTest suite (including strict FP gates)
        run: ctest --test-dir build-portable --output-on-failure -V 2>&1 | tee portability-evidence/ctest.txt
      - name: Full property batteries
        env:
          ABS_LIB_DIR: ${{ github.workspace }}/build-portable
        run: |
          python tests/pbt_equivalence_orbits.py --strict --output portability-evidence/property-equivalence.json
          python tests/pbt_certificate_equivariance.py --strict --output portability-evidence/property-certificates.json
      - name: Generate semantic snapshot
        run: python tests/compare_builds.py --snapshot build-portable --output semantic-${{ matrix.id }}.json
      - name: Install, relocate and consume outside source and build trees
        run: |
          tools/test_installed_consumer.sh "$PWD/build-portable" "$RUNNER_TEMP/abs-consumer" \
            2>&1 | tee portability-evidence/consumer.txt
      - name: Upload semantic snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-${{ matrix.id }}
          path: semantic-${{ matrix.id }}.json
          if-no-files-found: error
      - name: Retain portability evidence (no binary artifacts)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portability-evidence-${{ matrix.id }}
          path: portability-evidence/
          retention-days: 30

  toolchain-envelope:
    name: envelope / ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu22-gcc11-reference
            runner: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
            major: 11
            provider: reference
            packages: gcc-11 g++-11
          - id: ubuntu22-clang14-reference
            runner: ubuntu-22.04
            cc: clang-14
            cxx: clang++-14
            major: 14
            provider: reference
            packages: clang-14 libomp-14-dev
          - id: ubuntu24-gcc13-openblas
            runner: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            major: 13
            provider: openblas
            packages: gcc-13 g++-13 libopenblas-pthread-dev
          - id: ubuntu24-clang18-reference
            runner: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            major: 18
            provider: reference
            packages: clang-18 libomp-18-dev
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install distribution toolchains and providers
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} libblas-dev liblapack-dev libatomic1 pkg-config
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Assert compiler generation and record userspace
        run: |
          mkdir -p envelope-evidence
          test "$(uname -m)" = x86_64
          if [[ "$CC" == gcc* ]]; then
            test "$("$CC" -dumpversion | cut -d. -f1)" = '${{ matrix.major }}'
          else
            "$CC" --version | grep -E 'clang version ${{ matrix.major }}\.'
          fi
          {
            cat /etc/os-release
            uname -a
            getconf GNU_LIBC_VERSION
            ldd --version
            "$CC" --version
            "$CXX" --version
            cmake --version
            objdump --version
            dpkg-query -W | awk '$1 ~ /^lib(blas|lapack|openblas|gomp|omp|atomic)/'
          } 2>&1 | tee envelope-evidence/environment.txt
      - name: Configure explicit portable LP64 provider
        run: |
          if [ '${{ matrix.provider }}' = reference ]; then
            options=(-DBLA_VENDOR=Generic
              -DBLAS_LIBRARIES=/usr/lib/x86_64-linux-gnu/blas/libblas.so
              '-DLAPACK_LIBRARIES=/usr/lib/x86_64-linux-gnu/lapack/liblapack.so;/usr/lib/x86_64-linux-gnu/blas/libblas.so')
          else
            options=(-DBLA_VENDOR=OpenBLAS)
          fi
          cmake -S . -B build-envelope -DABS_BLAS=system -DABS_ARCH_FLAGS='' \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "${options[@]}" 2>&1 | tee envelope-evidence/configure.txt
      - name: Build and assert loaded provider identity
        run: |
          cmake --build build-envelope --parallel 3 2>&1 | tee envelope-evidence/build.txt
          python tools/check_blas_provider.py build-envelope '${{ matrix.provider }}' \
            | tee envelope-evidence/provider.json
          python tools/record_portability_build.py build-envelope envelope-evidence/provenance.json
      - name: Full semantic CTest and strict FP gates
        run: ctest --test-dir build-envelope --output-on-failure -V 2>&1 | tee envelope-evidence/ctest.txt
      - name: Full property batteries
        env:
          ABS_LIB_DIR: ${{ github.workspace }}/build-envelope
        run: |
          python tests/pbt_equivalence_orbits.py --strict --output envelope-evidence/property-equivalence.json
          python tests/pbt_certificate_equivariance.py --strict --output envelope-evidence/property-certificates.json
      - name: Install, relocate and consume
        run: tools/test_installed_consumer.sh "$PWD/build-envelope" "$RUNNER_TEMP/abs-envelope-consumer" 2>&1 | tee envelope-evidence/consumer.txt
      - name: Generate semantic snapshot
        run: python tests/compare_builds.py --snapshot build-envelope --output semantic-${{ matrix.id }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-${{ matrix.id }}
          path: semantic-${{ matrix.id }}.json
          if-no-files-found: error
      - name: Retain version evidence, never binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: envelope-evidence-${{ matrix.id }}
          path: envelope-evidence/
          if-no-files-found: error
          retention-days: 30

  cross-platform-semantics:
    name: cross-platform semantic agreement
    runs-on: ubuntu-24.04
    needs: [build-and-test, portability, toolchain-envelope, cmake-install]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: semantic-*
          path: snapshots
          merge-multiple: true
      - name: Require all platform, version and provider contracts to agree
        run: |
          python tests/compare_builds.py --compare-snapshots \
            snapshots/semantic-linux-x86_64-gcc.json \
            snapshots/semantic-linux-arm64-gcc.json \
            snapshots/semantic-linux-arm64-clang.json \
            snapshots/semantic-macos-arm64-appleclang.json \
            snapshots/semantic-ubuntu24-gcc13-reference.json \
            snapshots/semantic-ubuntu22-gcc11-reference.json \
            snapshots/semantic-ubuntu22-clang14-reference.json \
            snapshots/semantic-ubuntu24-gcc13-openblas.json \
            snapshots/semantic-ubuntu24-clang18-reference.json

  sanitizer-ctest:
    name: ASan + UBSan / ${{ matrix.partition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [native-leaks, stream-enomem, python-semantics]
    env:
      ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1:abort_on_error=1:symbolize=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install sanitizer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Record sanitizer environment
        run: |
          set -euo pipefail
          mkdir -p sanitizer-logs
          {
            printf 'runner OS: %s\n' "$RUNNER_OS"
            uname -a
            gcc --version
            cmake --version
            ulimit -a
            if [ -r /proc/self/limits ]; then sed -n '1,100p' /proc/self/limits; fi
            printf 'ASAN_OPTIONS=%s\n' "$ASAN_OPTIONS"
            printf 'UBSAN_OPTIONS=%s\n' "$UBSAN_OPTIONS"
            printf 'OPENBLAS_NUM_THREADS=%s\n' "$OPENBLAS_NUM_THREADS"
            printf 'OMP_NUM_THREADS=%s\n' "$OMP_NUM_THREADS"
            printf 'MKL_NUM_THREADS=%s\n' "$MKL_NUM_THREADS"
            printf 'BLIS_NUM_THREADS=%s\n' "$BLIS_NUM_THREADS"
          } | tee sanitizer-logs/environment.txt
      - name: Configure and build instrumented CTest targets
        run: |
          cmake -S . -B build-asan -DABS_SANITIZE=ON -DABS_BLAS=system -DABS_ARCH_FLAGS=''
          # The MXCSR probe is instrumented too, so its post-link execution
          # does not require preloading ASan into the compiler process.
          cmake --build build-asan -j2
      - name: Native solver lifecycle with LSan
        if: matrix.partition == 'native-leaks'
        run: |
          # The native example executables load instrumented shared libraries
          # but are not themselves linked to ASan, so preload its runtime.
          # Keep strict_fp_contraction out of this partition: it is a
          # structural compiler/objdump gate, and preloading libasan into every
          # subprocess makes the sanitizer runtime rather than the gate the
          # thing under test. The ordinary and full-CMake jobs run it directly.
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          ctest --test-dir build-asan --output-on-failure --timeout 90 \
                --output-log sanitizer-logs/native-leaks.ctest.log \
                -R '^(test_certified_diag|test_certified_diag_once|test_dgesdd_core_state|test_native_solver_lifecycle|test_unique_verifier_rows|rounding_probe|mxcsr_probe|link_contract|example_classify|example_certify|example_streaming)$'
      - name: Native stream ENOMEM with LSan and FakeStack
        if: matrix.partition == 'stream-enomem'
        run: |
          # RLIMIT_AS deliberately forces solver ENOMEM. Only this process
          # permits ASan to return NULL; FakeStack and LSan remain enabled.
          export ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=1:allocator_may_return_null=1:halt_on_error=1:abort_on_error=1:symbolize=1
          printf 'effective ASAN_OPTIONS=%s\n' "$ASAN_OPTIONS" | tee sanitizer-logs/stream-enomem-options.txt
          ctest --test-dir build-asan --output-on-failure --timeout 90 \
                --output-log sanitizer-logs/stream-enomem.ctest.log \
                -R '^test_stream_storage_native$'
      - name: Python semantic CTests with ASan, FakeStack and UBSan
        if: matrix.partition == 'python-semantics'
        env:
          # CI 36176732134: CPython/NumPy process-exit allocations, no solver
          # allocation frame. Native C lifecycle checks own solver leak coverage.
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=0:halt_on_error=1:abort_on_error=1:symbolize=1
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          printf 'effective ASAN_OPTIONS=%s\n' "$ASAN_OPTIONS" | tee sanitizer-logs/python-options.txt
          # Native test_stream_storage_native replaces the Python ENOMEM
          # fixture in sanitizer CI; all other Python CTests still run.
          ctest --test-dir build-asan --output-on-failure --timeout 90 \
                --output-log sanitizer-logs/python-semantics.ctest.log \
                -E '^(test_certified_diag|test_certified_diag_once|test_dgesdd_core_state|test_native_solver_lifecycle|test_unique_verifier_rows|test_stream_storage_native|test_stream_storage|rounding_probe|mxcsr_probe|link_contract|strict_fp_contraction|example_classify|example_certify|example_streaming)$'
      - name: Python property batteries with ASan, FakeStack and UBSan
        if: matrix.partition == 'python-semantics'
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=0:halt_on_error=1:abort_on_error=1:symbolize=1
        run: |
          set -euo pipefail
          # These batteries load the repository-root shared objects rather
          # than the CMake tree; retain their existing sanitized build path.
          chmod +x build_sanitized.sh
          ./build_sanitized.sh 2>&1 | tee sanitizer-logs/python-battery-build.log
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          for battery in pbt_certificate_equivariance pbt_equivalence_orbits; do
            python "tests/$battery.py" --strict 2>&1 | tee "sanitizer-logs/$battery.log"
          done
      - name: Upload CTest and sanitizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitizer-ctest-${{ matrix.partition }}
          path: |
            sanitizer-logs/
            build-asan/Testing/Temporary/*.log
          retention-days: 14
          if-no-files-found: error

  cmake-install:
    name: cmake, system BLAS, install and consume
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install a system BLAS
        # The point of this job is that building the library needs no Python
        # and no SciPy wheel.  Python is installed here only to run the
        # existing batteries against the CMake build tree.
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev gcc-13 g++-13
          test "$("$CC" -dumpversion | cut -d. -f1)" = 13
          "$CC" --version

      - name: Configure and build against the system BLAS
        # Portable arch flags: this job is about linkage and packaging, and a
        # native build would tie its artefacts to the runner.
        run: |
          cmake -B build-system -DABS_BLAS=system -DABS_ARCH_FLAGS='' -DBLA_VENDOR=Generic \
            -DBLAS_LIBRARIES=/usr/lib/x86_64-linux-gnu/blas/libblas.so \
            '-DLAPACK_LIBRARIES=/usr/lib/x86_64-linux-gnu/lapack/liblapack.so;/usr/lib/x86_64-linux-gnu/blas/libblas.so'
          cmake --build build-system -j"$(nproc)"

      - name: Run the probes, examples and batteries
        run: ctest --test-dir build-system --output-on-failure

      - name: Full reference BLAS properties and normalized certificate snapshot
        env:
          ABS_LIB_DIR: ${{ github.workspace }}/build-system
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/check_blas_provider.py build-system reference
          python tests/pbt_equivalence_orbits.py --strict
          python tests/pbt_certificate_equivariance.py --strict
          python tests/compare_builds.py --snapshot build-system --output semantic-ubuntu24-gcc13-reference.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-ubuntu24-gcc13-reference
          path: semantic-ubuntu24-gcc13-reference.json
          if-no-files-found: error

      - name: Install and consume from a separate project
        # find_package must work from a tree that has never seen the sources.
        # This also catches an install that forgets $ORIGIN on the libraries,
        # or a .pc file that baked in the configure-time prefix.
        run: |
          cmake --install build-system --prefix "$PWD/_prefix"
          test -f _prefix/include/affine_bundle/router.h
          test ! -f _prefix/include/affine_bundle/formation_guard.h
          test ! -f _prefix/include/affine_bundle/blas_symbols.h
          cmake -S tests/consumer -B build-consumer \
                -DCMAKE_PREFIX_PATH="$PWD/_prefix"
          cmake --build build-consumer
          ./build-consumer/consumer
          ./build-consumer/consumer_certified_diag
          ./build-consumer/consumer_certified_diag_cpp
          if ldd ./build-consumer/consumer | grep -q "not found"; then
            echo "installed libraries cannot resolve their own dependencies"
            exit 1
          fi
          PKG_CONFIG_PATH="$PWD/_prefix/lib/pkgconfig" \
            pkg-config --cflags --libs affine-bundle-solver

  blas-independence:
    name: classification does not depend on the BLAS
    runs-on: ubuntu-24.04
    needs: cmake-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install a system BLAS
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev
      - name: Build against each BLAS in turn
        run: |
          cmake -B .cfg/openblas -DABS_BLAS=scipy-openblas -DABS_ARCH_FLAGS=''
          cmake --build .cfg/openblas -j"$(nproc)"
          cmake -B .cfg/refblas -DABS_BLAS=system -DABS_ARCH_FLAGS=''
          cmake --build .cfg/refblas -j"$(nproc)"
      - name: Compare classification output
        # Two different BLAS implementations sum in a different order, so
        # last-bit results legitimately differ.  Status, rank and the rank
        # interval must not.  If this job ever fails, the manuscript's
        # classification claims are implementation dependent and have to say
        # so.
        run: python tests/compare_builds.py .cfg/openblas .cfg/refblas
      - name: Compare fixed-corpus certificate profiles including extreme ranges
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/check_blas_provider.py .cfg/openblas openblas
          python tools/check_blas_provider.py .cfg/refblas reference
          python tests/compare_builds.py --snapshot .cfg/openblas --output blas-openblas.json
          python tests/compare_builds.py --snapshot .cfg/refblas --output blas-reference.json
          python tests/compare_builds.py --compare-snapshots blas-openblas.json blas-reference.json

  cross-config-consistency:
    name: portable vs native agree
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Build both configurations
        run: |
          chmod +x build.sh
          ARCH_FLAGS='' ./build.sh
          mkdir -p .cfg/portable && cp ./*.so .cfg/portable/
          ARCH_FLAGS='-march=native' ./build.sh
          mkdir -p .cfg/native && cp ./*.so .cfg/native/
      - name: Compare classification output
        # -march=native enables FMA contraction, so last-bit results may
        # differ.  The classification, rank interval and rank must not.
        run: python tests/compare_builds.py .cfg/portable .cfg/native

  source-candidate:
    name: verified source and research candidate
    needs: release-context
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: needs.release-context.outputs.build == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install release build dependencies
        if: needs.release-context.outputs.build == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-science lmodern

      - name: Build candidate inputs
        if: needs.release-context.outputs.build == 'true'
        env:
          BIBTEX: bibtex
        run: |
          ARCH_FLAGS="" ./build.sh
          ./build_paper.sh
          tools/vectorization_report.sh vectorization-report
          python tests/check_paper_claims.py

      - name: Package exact release bytes
        if: needs.release-context.outputs.build == 'true'
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: tools/build_release_candidate.sh "$VERSION" "$GITHUB_SHA" dist

      - name: Verify both archives from clean extraction directories
        if: needs.release-context.outputs.build == 'true'
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          source_dir=$(mktemp -d)
          research_dir=$(mktemp -d)
          tar -xzf "dist/affine-bundle-solver-v$VERSION.tar.gz" -C "$source_dir"
          tar -xzf "dist/affine-bundle-solver-v$VERSION-research.tar.gz" -C "$research_dir"
          source_root="$source_dir/affine-bundle-solver-v$VERSION"
          research_root="$research_dir/affine-bundle-solver-v$VERSION-research"
          (cd "$source_root" && sha256sum -c MANIFEST.sha256)
          (cd "$research_root" && sha256sum -c MANIFEST.sha256)
          (
            cd "$source_root"
            ARCH_FLAGS="" ./build.sh
            python tests/check_paper_claims.py
          )

      - name: Upload the verified candidate
        if: needs.release-context.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-release-candidate
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release-candidate:
    name: verified release candidate
    needs: [release-context, source-candidate, binary-qualification]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful producers before aggregation
        env:
          CONTEXT: ${{ needs.release-context.result }}
          BUILD: ${{ needs.release-context.outputs.build }}
          SOURCE: ${{ needs.source-candidate.result }}
          BINARY: ${{ needs.binary-qualification.result }}
        run: |
          test "$CONTEXT" = success
          test "$SOURCE" = success
          if [ "$BUILD" = true ]; then test "$BINARY" = success; fi
          if [ "$BINARY" != success ] && [ "$BINARY" != skipped ]; then exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.release-context.outputs.build == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.release-context.outputs.build == 'true'
        with:
          name: source-release-candidate
          path: source-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.release-context.outputs.build == 'true'
        with:
          name: sdk-linux-x86_64
          path: binary-candidates/sdk-linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.release-context.outputs.build == 'true'
        with:
          name: sdk-linux-arm64
          path: binary-candidates/sdk-linux-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.release-context.outputs.build == 'true'
        with:
          name: sdk-macos-arm64
          path: binary-candidates/sdk-macos-arm64
      - name: Aggregate already verified bytes and verify five checksums
        if: needs.release-context.outputs.build == 'true'
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python3 tools/release_assets.py aggregate source-candidate binary-candidates dist "$VERSION" "$GITHUB_SHA"
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.release-context.outputs.build == 'true'
        with:
          name: release-candidate
          path: dist/
          retention-days: 7
          if-no-files-found: error

  verification-gate:
    name: verification gate
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - build-and-test
      - sanitizer-ctest
      - cmake-install
      - blas-independence
      - cross-config-consistency
      - release-candidate
      - publication-validation
      - portability
      - toolchain-envelope
      - cross-platform-semantics
    steps:
      - name: Require every verification job
        env:
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          SANITIZER_CTEST: ${{ needs.sanitizer-ctest.result }}
          CMAKE_INSTALL: ${{ needs.cmake-install.result }}
          BLAS_INDEPENDENCE: ${{ needs.blas-independence.result }}
          CROSS_CONFIG: ${{ needs.cross-config-consistency.result }}
          PUBLICATION_VALIDATION: ${{ needs.publication-validation.result }}
          RELEASE_CANDIDATE: ${{ needs.release-candidate.result }}
          PORTABILITY: ${{ needs.portability.result }}
          ENVELOPE: ${{ needs.toolchain-envelope.result }}
          CROSS_PLATFORM: ${{ needs.cross-platform-semantics.result }}
        run: |
          failed=0
          for result in "$BUILD_AND_TEST" "$SANITIZER_CTEST" "$CMAKE_INSTALL" \
                        "$BLAS_INDEPENDENCE" "$CROSS_CONFIG" "$RELEASE_CANDIDATE" \
                        "$PORTABILITY" "$ENVELOPE" "$CROSS_PLATFORM" "$PUBLICATION_VALIDATION"; do
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more required verification jobs did not succeed"
            printf '%s\n' \
              "build-and-test=$BUILD_AND_TEST" \
              "sanitizer-ctest=$SANITIZER_CTEST" \
              "cmake-install=$CMAKE_INSTALL" \
              "blas-independence=$BLAS_INDEPENDENCE" \
              "cross-config-consistency=$CROSS_CONFIG" \
              "release-candidate=$RELEASE_CANDIDATE" \
              "portability=$PORTABILITY" \
              "toolchain-envelope=$ENVELOPE" \
              "cross-platform-semantics=$CROSS_PLATFORM"
            exit 1
          fi
