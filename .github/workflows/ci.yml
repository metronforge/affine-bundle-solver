name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run catches breakage from toolchain or NumPy/SciPy updates
    # rather than from our own commits.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.cc }} / ${{ matrix.arch_label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable build is the reference configuration: results must not
          # depend on the instruction set of the build machine.
          - cc: gcc
            arch: ''
            arch_label: portable
            required: true
          # -march=native is the default in build.sh and is what the paper's
          # timings were produced with.
          - cc: gcc
            arch: '-march=native'
            arch_label: native
            required: true
          # clang exercises a different floating-point front end.  The
          # directed-rounding contract rests on -frounding-math, whose
          # handling differs between compilers, so this job is the portability
          # check for the certificate arithmetic.  Not yet verified locally --
          # keep informational until it has passed once, then flip required.
          - cc: clang
            arch: ''
            arch_label: portable
            required: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install compiler
        run: |
          sudo apt-get update
          if [ "${{ matrix.cc }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi
          ${{ matrix.cc }} --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import numpy,scipy,mpmath,threadpoolctl; \
            print('numpy',numpy.__version__,'scipy',scipy.__version__)"

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          ARCH_FLAGS: ${{ matrix.arch }}
        run: |
          chmod +x build.sh
          ./build.sh
        # build.sh runs two build-time probes and fails the build if either
        # fails:
        #   rounding_probe -- upward and downward rounding are distinguishable
        #   mxcsr_probe    -- loading the -ffast-math fast library does not set
        #                     FTZ/DAZ process-wide, which would make the
        #                     subnormal-range certificate checks vacuous

      - name: Compiler warnings (informational)
        continue-on-error: true
        run: |
          echo "::group::strict warning scan"
          for f in src/*.c; do
            ${{ matrix.cc }} -std=c11 -Wall -Wextra -Wshadow \
              -c "$f" -o /dev/null -Isrc 2>&1 || true
          done | grep "warning:" | sed 's/.*warning: //' \
               | sort | uniq -c | sort -rn || echo "no warnings"
          echo "::endgroup::"

      - name: Regression tests
        run: |
          for t in test_certified_api \
                   test_verifier_adversarial \
                   test_status_profile_semantics \
                   test_meta_api_absent_solution_quality; do
            echo "::group::$t"
            python tests/$t.py
            echo "::endgroup::"
          done

      - name: Property batteries
        run: |
          echo "::group::pbt_equivalence_orbits"
          python tests/pbt_equivalence_orbits.py
          echo "::endgroup::"
          echo "::group::pbt_certificate_equivariance"
          python tests/pbt_certificate_equivariance.py
          echo "::endgroup::"

      - name: Manuscript claim reproduction
        # This is the step that matters for a paper artifact: it fails when a
        # number printed in paper.tex no longer comes out of the build, even
        # if every individual test passes.
        run: python tests/check_paper_claims.py

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.cc }}-${{ matrix.arch_label }}
          path: |
            *.so
          retention-days: 14
          if-no-files-found: warn

  cross-config-consistency:
    name: portable vs native agree
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build both configurations
        run: |
          chmod +x build.sh
          ARCH_FLAGS='' ./build.sh
          mkdir -p .cfg/portable && cp ./*.so .cfg/portable/
          ARCH_FLAGS='-march=native' ./build.sh
          mkdir -p .cfg/native && cp ./*.so .cfg/native/
      - name: Compare classification output
        # -march=native enables FMA contraction, so last-bit results may
        # differ.  The classification, rank interval and rank must not.
        run: python tests/compare_builds.py .cfg/portable .cfg/native
