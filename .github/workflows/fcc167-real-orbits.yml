name: FCC 167 real orbit weights / native ABS

on:
  push:
    branches: [experiment/ngc6278-orbit-abs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fcc167-orbit-matrix-and-abs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout actual ABS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned DYNAMITE and published FCC 167 inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dynamics-of-stellar-systems/dynamite
          ref: 0bd10a9586936bf6b9bcfdcd3679477d812a01d0
          path: external/dynamite
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install required native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran libblas-dev liblapack-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m pip install --disable-pip-version-check -r external/dynamite/requirements.txt
          python -m pip install --disable-pip-version-check -e external/dynamite
      - name: Build DYNAMITE orbit integrators without GALAHAD
        run: make -C external/dynamite/legacy_fortran nogal triaxmass triaxmassbin
      - name: Build native ABS and checker
        env:
          ARCH_FLAGS: ''
        run: ./build.sh
      - name: Run real FCC 167 orbit matrix through native ABS and NNLS
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python experiments/fcc167_real_orbits.py
      - name: Upload matrix and numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc167-real-orbit-abs
          path: results/real-fcc167/
          if-no-files-found: warn
          retention-days: 14
