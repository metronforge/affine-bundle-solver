name: manuscript

# The manuscript is a separate artefact from the library and breaks for
# separate reasons, so it builds on its own schedule rather than on every
# change to a C file.  This workflow is not a required check; see the note in
# ci.yml about why filtered workflows must not be.
# The path list is repeated rather than shared through a YAML anchor: the
# workflow parser does not accept anchors, and a file it refuses to parse
# simply never runs.
on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.bib'
      - 'build_paper.sh'
      - 'scripts/build_manuscript_container.sh'
      - 'ci/texlive/image.txt'
      - 'tests/test_manuscript_launcher.py'
      - 'tests/manuscript_container_contract.py'
      - '.github/workflows/manuscript.yml'
  pull_request:
    paths:
      - '**.tex'
      - '**.bib'
      - 'build_paper.sh'
      - 'scripts/build_manuscript_container.sh'
      - 'ci/texlive/image.txt'
      - 'tests/test_manuscript_launcher.py'
      - 'tests/manuscript_container_contract.py'
      - '.github/workflows/manuscript.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: manuscript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manuscript:
    name: manuscript builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate host launcher
        run: python3 -m unittest discover -s tests -p test_manuscript_launcher.py -v

      - name: Pull the pinned prebuilt toolchain
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Repository-linked private packages need read authentication.
          # The token stays on the runner and is never passed into TeX.
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          image=$(< ci/texlive/image.txt)
          start=$SECONDS
          docker pull "$image"
          echo "Cold-runner image pull: $((SECONDS-start)) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "Toolchain: $image" >> "$GITHUB_STEP_SUMMARY"

      - name: Build host manuscript offline with the pinned toolchain
        run: |
          start=$SECONDS
          bash scripts/build_manuscript_container.sh
          echo "Manuscript build: $((SECONDS-start)) seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Container positive and controlled-negative checks
        run: |
          export MANUSCRIPT_IMAGE=$(< ci/texlive/image.txt)
          python3 tests/manuscript_container_contract.py

      - name: Check for unresolved references
        # A broken \cref or \cite is a silent warning in LaTeX, not an error.
        # After a text edit that is exactly the failure worth catching, so it
        # is promoted to a build failure here.
        run: |
          if grep -E "Reference .* undefined|Citation .* undefined" paper.log; then
            echo "::error::manuscript has unresolved references or citations"
            exit 1
          fi
          echo "no unresolved references"

      - name: Upload manuscript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-pdf
          path: paper.pdf
          retention-days: 30
          if-no-files-found: error
