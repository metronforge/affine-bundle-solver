name: NGC 6278 real orbit weights / native ABS

on:
  push:
    branches: [experiment/ngc6278-orbit-abs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orbit-matrix-and-abs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout actual ABS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned DYNAMITE with real CALIFA example data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dynamics-of-stellar-systems/dynamite
          ref: 0bd10a9586936bf6b9bcfdcd3679477d812a01d0
          path: external/dynamite
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install required native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran libblas-dev liblapack-dev
          gfortran --version
      - name: Install Python scientific dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m pip install --disable-pip-version-check -r external/dynamite/requirements.txt
          python -m pip install --disable-pip-version-check -e external/dynamite
      - name: Build DYNAMITE orbit integrators (NNLS mode, no Galahad)
        run: make -C external/dynamite/legacy_fortran all
      - name: Build unmodified native ABS and strict checker
        env:
          ARCH_FLAGS: ''
        run: ./build.sh
      - name: Assemble real NGC 6278 orbit matrix and compare actual solvers
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python experiments/ngc6278_real_orbits.py
      - name: Upload actual data matrix, provenance and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngc6278-real-orbit-abs
          path: results/real-ngc6278/
          if-no-files-found: warn
          retention-days: 14
