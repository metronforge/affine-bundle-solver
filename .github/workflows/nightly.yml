name: nightly

# The coverage percentage is informational: it reports a number, it does not
# gate anything. Build and test-process failures still fail this canary.
# Running it on every pull request cost minutes and told nobody anything they
# acted on, so it runs weekly and on demand instead.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: branch coverage (informational)
    runs-on: ubuntu-24.04
    # Reported, not enforced.  A threshold would invite writing tests that
    # move the number rather than tests that check something, which is the
    # opposite of what the property batteries are for.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build with coverage instrumentation
        run: |
          chmod +x build_coverage.sh
          ./build_coverage.sh
      - name: Exercise the suite
        run: |
          for t in test_certified_api test_verifier_adversarial \
                   test_status_profile_semantics \
                   test_meta_api_absent_solution_quality \
                   pbt_certificate_equivariance pbt_equivalence_orbits; do
            echo "::group::$t"
            python tests/$t.py
            echo "::endgroup::"
          done
      - name: Report
        run: |
          echo "::group::coverage"
          gcov -b -o . bsolver.cov.o 2>/dev/null | \
            grep -A3 "bsolver.c" || true
          gcov -b -o . formation_guard.cov.o 2>/dev/null | \
            grep -A3 "formation_guard.c" || true
          echo "::endgroup::"
      - name: Upload gcov output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-gcov
          path: "*.gcov"
          retention-days: 14
          if-no-files-found: warn

      - name: Record compiler vectorization decisions
        if: always()
        run: tools/vectorization_report.sh vectorization-report

      - name: Upload vectorization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vectorization-report
          path: vectorization-report/
          retention-days: 30
          if-no-files-found: error
