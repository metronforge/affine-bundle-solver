name: publish-release

on:
  workflow_run:
    workflows: [build-and-test]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build-and-test push run on main containing the verified release candidate
        type: string
        required: true

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || inputs.source_run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish verified immutable release
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve and validate successful main build run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            run_id=$EVENT_RUN_ID
            verified_sha=$EVENT_SHA
          else
            if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "source_run_id must be a numeric GitHub Actions run ID" >&2
              exit 1
            fi
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
            if ! jq -e '
              .name == "build-and-test" and
              .event == "push" and
              .head_branch == "main" and
              .conclusion == "success" and
              (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
            ' <<<"$run" >/dev/null; then
              echo "source run is not a successful build-and-test push on main" >&2
              exit 1
            fi
            run_id=$SOURCE_RUN_ID
            verified_sha=$(jq -r '.head_sha' <<<"$run")
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "verified_sha=$verified_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.verified_sha }}
          fetch-depth: 2

      - name: Detect and validate a release commit
        id: release
        env:
          VERIFIED_SHA: ${{ steps.source.outputs.verified_sha }}
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          previous=$(git show HEAD^:.release-please-manifest.json 2>/dev/null \
            | jq -r '."."' 2>/dev/null || true)
          if [ -z "$previous" ] || [ "$version" = "$previous" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "ordinary main commit; nothing to publish"
            exit 0
          fi
          python3 tools/release_assets.py identity . "$version" "$(git rev-parse HEAD)" "$VERIFIED_SHA"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download the candidate from the successful CI run
        if: steps.release.outputs.created == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify complete candidate checksums, names and binary identity
        if: steps.release.outputs.created == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          VERIFIED_SHA: ${{ steps.source.outputs.verified_sha }}
        run: |
          python3 tools/release_assets.py verify dist "$VERSION" "$VERIFIED_SHA"
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Create or resume the exact draft
        if: steps.release.outputs.created == 'true'
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERIFIED_SHA: ${{ steps.source.outputs.verified_sha }}
        run: |
          git fetch --no-tags origin main
          git show origin/main:docs/releases/v0.5.0.md > "$RUNNER_TEMP/release-notes.md"
          response="$RUNNER_TEMP/release-lookup.json"
          error="$RUNNER_TEMP/release-lookup.stderr"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$response" 2>"$error"
          api_status=$?
          set -e
          state=$(python3 tools/release_assets.py release-state "$response" "$TAG" "$VERIFIED_SHA") || {
            cat "$error" >&2
            exit 1
          }
          if [ "$state" = missing ]; then
            if [ "$api_status" -eq 0 ]; then
              echo "GitHub returned Not Found without an HTTP error" >&2
              exit 1
            fi
            gh release create "$TAG" --draft --target "$VERIFIED_SHA" \
              --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            echo "state=draft" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$api_status" -ne 0 ]; then
            cat "$error" >&2
            echo "GitHub release lookup failed unexpectedly" >&2
            exit 1
          fi
          if [ "$state" = immutable ]; then
            echo "state=immutable" >> "$GITHUB_OUTPUT"
          elif [ "$state" = draft ]; then
            echo "state=draft" >> "$GITHUB_OUTPUT"
          else
            echo "existing release is published but not immutable" >&2
            exit 1
          fi

      - name: Attach exact assets without overwriting
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 tools/release_assets.py names "$VERSION" > "$RUNNER_TEMP/expected-assets.txt"
          while IFS= read -r name; do
            path="dist/$name"
            asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$name\") | .id")
            if [ -n "$asset_id" ]; then
              tmp=$(mktemp -d)
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                -H 'Accept: application/octet-stream' > "$tmp/$name"
              python3 tools/release_assets.py identical "$path" "$tmp/$name"
              echo "$name already attached with the expected bytes"
            else
              gh release upload "$TAG" "$path"
            fi
          done < "$RUNNER_TEMP/expected-assets.txt"

      - name: Verify the attached bytes and publish
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          STATE: ${{ steps.draft.outputs.state }}
          VERSION: ${{ steps.release.outputs.version }}
          VERIFIED_SHA: ${{ steps.source.outputs.verified_sha }}
        run: |
          remote=$(mktemp -d)
          gh release download "$TAG" --dir "$remote"
          python3 tools/release_assets.py verify "$remote" "$VERSION" "$VERIFIED_SHA"
          (cd "$remote" && sha256sum -c SHA256SUMS.txt)
          while IFS= read -r name; do
            python3 tools/release_assets.py identical "dist/$name" "$remote/$name"
          done < "$RUNNER_TEMP/expected-assets.txt"
          if [ "$STATE" = draft ]; then
            gh release edit "$TAG" --draft=false --latest
          fi
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable // false')
          if [ "$immutable" != true ]; then
            echo "published release is not immutable" >&2
            exit 1
          fi
          echo "$TAG is immutable and its downloaded assets match SHA256SUMS.txt"
