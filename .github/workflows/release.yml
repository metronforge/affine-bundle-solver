name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          # ФИКС: Заставляем release-please создавать только черновик (Draft)
          draft: true

      # Everything below runs only on the push that MERGES the release pull
      # request, i.e. when a release was actually created.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-python@v5
        if: ${{ steps.release.outputs.release_created }}
        with:
          python-version: '3.12'

      - name: Verify the released commit builds and reproduces the manuscript
        if: ${{ steps.release.outputs.release_created }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          chmod +x build.sh
          ./build.sh
          python tests/check_paper_claims.py

      - name: Attach the source archive to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git archive --format=tar.gz --prefix="affine-bundle-solver-${TAG}/" \
            -o "affine-bundle-solver-${TAG}.tar.gz" HEAD
          # Загружаем архив в черновик (это разрешено, так как он еще не immutable)
          gh release upload "$TAG" "affine-bundle-solver-${TAG}.tar.gz" --clobber

      - name: Publish the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release edit "$TAG" --draft=false
