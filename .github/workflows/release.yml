name: release-pr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-pr-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: update release pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Detect the merge of a release pull request
        id: release-commit
        shell: bash
        run: |
          current=$(jq -r '."."' .release-please-manifest.json)
          previous=$(git show HEAD^:.release-please-manifest.json 2>/dev/null \
            | jq -r '."."' 2>/dev/null || true)
          if [ -n "$previous" ] && [ "$current" != "$previous" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "release commit: $previous -> $current"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      # PR creation and release publication are intentionally separate. On a
      # release commit this job does nothing; the publish workflow consumes
      # the exact candidate saved by successful CI.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        if: steps.release-commit.outputs.merged != 'true'
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
