name: manuscript toolchain image

# Publication is confined to trusted pushes. PRs never receive package-write
# credentials. The explicit branch bootstraps the first image before the
# manuscript consumer can reference its digest; normal updates use main.
on:
  push:
    branches: [main, ci/texlive-container]
    paths:
      - 'ci/texlive/Dockerfile'
      - 'ci/texlive/build-manuscript'
      - 'tests/manuscript_container_contract.py'
      - '.github/workflows/texlive-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: qualify and publish TeX toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build image without manuscript sources
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag abs-texlive:qualification ci/texlive
      - name: Offline positive and controlled-negative integration checks
        env:
          MANUSCRIPT_IMAGE: abs-texlive:qualification
        run: python3 tests/manuscript_container_contract.py
      - name: Publish qualified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-texlive"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag abs-texlive:qualification "$image:$tag"
          docker push "$image:$tag"
          docker image inspect "$image:$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | tee image-digest.txt
          test -s image-digest.txt
          docker run --rm --network=none "$image:$tag" \
            cat /usr/local/share/abs-texlive/packages.tsv > texlive-packages.tsv
          cat image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve digest and installed package inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: texlive-image-provenance
          path: |
            image-digest.txt
            texlive-packages.tsv
          if-no-files-found: error
