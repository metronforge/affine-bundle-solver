name: manuscript toolchain image

# Publication is confined to trusted pushes. PRs never receive package-write
# credentials. The explicit branch bootstraps the first image before the
# manuscript consumer can reference its digest; normal updates use main.
on:
  push:
    branches: [main, ci/texlive-container]
    paths:
      - 'ci/texlive/Dockerfile'
      - 'ci/texlive/build-manuscript'
      - 'ci/texlive/run-command'
      - 'tests/manuscript_container_contract.py'
      - 'tests/texlive_graphics_contract.py'
      - 'tests/fixtures/texlive-graphics/**'
      - '.github/workflows/texlive-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: qualify and publish TeX toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build image without manuscript sources
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag abs-texlive:qualification ci/texlive
      - name: Offline positive and controlled-negative integration checks
        env:
          MANUSCRIPT_IMAGE: abs-texlive:qualification
        run: python3 tests/manuscript_container_contract.py
      - name: Qualify offline TikZ, PGF, and PGFPlots support
        env:
          MANUSCRIPT_IMAGE: abs-texlive:qualification
        run: python3 tests/texlive_graphics_contract.py
      - name: Publish qualified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/metronforge/texlive-custom"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag abs-texlive:qualification "$image:$tag"
          docker push "$image:$tag"
          digest_ref=$(docker image inspect "$image:$tag" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -v prefix="$image@" 'index($0, prefix) == 1 { print; exit }')
          digest=${digest_ref#"$image@"}
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'registry did not return a digest for the new package coordinate' >&2
            exit 1
          fi
          printf '%s@%s\n' "$image" "$digest" > image-digest.txt
          docker pull "$image@$digest"
          MANUSCRIPT_IMAGE="$image@$digest" python3 tests/texlive_graphics_contract.py
          docker run --rm --network=none "$image@$digest" \
            cat /usr/local/share/abs-texlive/packages.tsv > texlive-packages.tsv
          {
            echo "Published image: $image@$digest"
            echo 'Installed package inventory:'
            cat texlive-packages.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve digest and installed package inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: texlive-image-provenance
          path: |
            image-digest.txt
            texlive-packages.tsv
          if-no-files-found: error
